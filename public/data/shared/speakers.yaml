-
  id: jeronimo-castrillon
  image: Jeronimo_Castrillon.webp
  name: Jeronimo Castrillon
  institution: Technische Universität Dresden
  institution_acronym: TU Dresden
  webpage: https://cfaed.tu-dresden.de/ccc-staff-castrillon
  bio: "Jeronimo Castrillon is a professor in the Department of Computer Science at the TU Dresden, where he is also affiliated with the Center for Advancing Electronics Dresden (CfAED), the Center for Scalable Data Analytics and Artificial Intelligence Dresden/Leipzig (ScaDS.AI), the 6G-life Hub, and the Barkhausen Institut. He is the head of the Chair for Compiler Construction, with research focus on programming and design methodologies as well as computer architectures for complex emerging computing systems. He received a degree in Electronic Engineering from the Pontificia Bolivariana University in Colombia in 2004, his masters degree from the University of Lugano in Switzerland in 2006 and his Ph.D. degree (Dr.-Ing.) with honors from the RWTH Aachen University in Germany in 2013. In 2014, Prof. Castrillon co-founded Silexica GmbH/Inc, a company that provided programming tools for heterogenous architectures, now with Xilinx/AMD. In 2023, he co-founded Xronos, a company that develops tools and services for safe cyber-physical systems. Prof. Castrillon has more than 150 international publications, is Senior Member IEEE, Senior Member ACM, and is a member of the editorial board of the ACM TODAES, IEEE TC, and IEEE ESL. In 2025 he received a Consolidator Grant from the European Research Council (ERC)."

