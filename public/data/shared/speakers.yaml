-
  id: tayana-conte
  image: Tayana_Conte.webp
  name: Tayana Conte
  institution: Universidade Federal do Amazonas
  institution_acronym: UFAM
  bio: "Prof. Tayana Conte is a leading researcher in Software Engineering, Human Factors, and User Experience, with extensive contributions to the design, evaluation, and adoption of software-intensive systems. She is an Associate Professor at the Federal University of Amazonas (UFAM), Brazil, where she leads the USES (UX and Software Engineering) Research Group. Her research focuses on understanding how humans interact with complex software and AI-enabled systems, combining empirical methods, behavioral perspectives, and human-centered design principles. She has published more than 300 scientific papers, supervised over 45 graduate students, and established strong international collaborations. Tayana serves as Editor-in-Chief of the Journal of Software Engineering Research and Development (JSERD) and as Associate Editor of Empirical Software Engineering (EMSE), Science of Computer Programming (SCP), and ACM Transactions on Software Engineering and Methodology (TOSEM). In 2023, she became the first Latin American recipient of the IEEE TCSE Distinguished Education Award."

