- id: elaine-naomi-watanabe
  name: Elaine Naomi Watanabe
  image: Elaine_Naomi_Watanabe.webp
  bio: Engenheira de software com mais de 18 anos de experiência, apaixonada por construir sistemas confiáveis e escaláveis e por promover excelência técnica. Tem interesse especial por arquitetura de software, sistemas distribuídos, qualidade de software, evolução de sistemas e liderança técnica, com experiência principalmente em Ruby e Elixir e em programação funcional. Atualmente, é Staff Software Engineer em uma empresa que opera um marketplace de revenda de produtos de luxo. É coorganizadora do workshop Rails Girls São Paulo e do meetup Elixir São Paulo.

