  institution: 1M Bits Horde
  institution_acronym: 1M Bits Horde
  bio: CEO, Head of Studio, and Founder of 1M Bits Horde, with over 14 years of experience in the games and applications industry. Former Tech Evangelist and Head of Developer Advocacy for Games at Unity Technologies. He has developed more than 150 game prototypes, launched over eight games, and delivered 80+ talks at events such as GDC, Gamescom, and Unite.

