- id: marcelo-medeiros-eler
  name: Marcelo Medeiros Eler
  image: Marcelo_Medeiros_Eler.webp
  institution: EACH — USP
  institution_acronym: EACH (USP)
  bio: Marcelo Medeiros Eler possui graduação em Ciência da Computação pela Universidade do Oeste Paulista (2003), mestrado (2006) e doutorado (2012) em Ciências da Computação e Matemática Computacional pela Universidade de São Paulo. Realizou doutorado sanduíche (2010–2011) no Centro Nacional de Pesquisa da Itália, em Pisa, sob supervisão da Dra. Antonia Bertolino, e pós-doutorado (2016–2017) no Departamento de Ciência da Computação da Universidade de Sheffield (Inglaterra), sob supervisão do Prof. Gordon Fraser. Atualmente é Professor Associado no curso de Sistemas de Informação da Escola de Artes, Ciências e Humanidades da USP, atuando na graduação e na pós-graduação acadêmica. É vice-coordenador do Programa de Pós-graduação em Sistemas de Informação da EACH-USP e tutor do Programa de Educação Tutorial em Sistemas de Informação (PET-SI). Suas pesquisas atuais concentram-se em Acessibilidade Digital e Engenharia de Software, com ênfase em Teste de Software.

